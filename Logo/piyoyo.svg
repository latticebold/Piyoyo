<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" role="img" aria-labelledby="title desc">
  <title id="title">Piyoyo logo</title>
  <desc id="desc">A cute yellow chick hatching from an eggshell, with a greater-than sign eye, an underscore-like orange beak, and the text Py! in a Coiny-style outlined vector form.</desc>

  <defs>
    <radialGradient id="body" cx="54%" cy="40%" r="72%" fx="55%" fy="39%">
      <stop offset="0" stop-color="#FFE956"/>
      <stop offset=".35" stop-color="#FDDD3E"/>
      <stop offset=".64" stop-color="#FCD437"/>
      <stop offset=".82" stop-color="#FCCA31"/>
      <stop offset="1" stop-color="#F7AE27"/>
    </radialGradient>

    <radialGradient id="wing" cx="36%" cy="26%" r="82%">
      <stop offset="0" stop-color="#FFEB58"/>
      <stop offset=".58" stop-color="#FDDD3E"/>
      <stop offset="1" stop-color="#F7B52B"/>
    </radialGradient>

    <radialGradient id="shell" cx="48%" cy="22%" r="84%">
      <stop offset="0" stop-color="#FFFEFD"/>
      <stop offset=".6" stop-color="#FAF4EF"/>
      <stop offset="1" stop-color="#EBD9CF"/>
    </radialGradient>

    <linearGradient id="orange" x1="0" y1="0" x2=".65" y2="1">
      <stop offset="0" stop-color="#FF971B"/>
      <stop offset="1" stop-color="#FF7416"/>
    </linearGradient>

    <linearGradient id="beak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF5C0D"/>
      <stop offset="1" stop-color="#FF7817"/>
    </linearGradient>

    <linearGradient id="outline" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#1A2D40"/>
      <stop offset=".5" stop-color="#142437"/>
      <stop offset="1" stop-color="#0D1C2D"/>
    </linearGradient>
  </defs>

